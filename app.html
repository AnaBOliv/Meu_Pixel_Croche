<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pixel Crochê</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <a href="index.html" class="botao">⬅ Voltar</a>

    <h1>🧶 Pixel Crochê</h1>

    <p>
      Ferramenta para acompanhar seu projeto de tapeçaria de crochê ponto a ponto
    </p>

    <input type="file" id="upload">

    <p id="info">Carreira: - | Ponto: -</p>

    <div>
      <button onclick="zoomIn()">➕ Zoom</button>
      <button onclick="zoomOut()">➖ Zoom</button>
      <button onclick="salvarProjeto()">💾 Salvar</button>
    </div>

    <div id="grid"></div>

    <h3>✨ Continue evoluindo seu projeto!</h3>

  </div>

  <footer>
    <p>Ana B.</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
