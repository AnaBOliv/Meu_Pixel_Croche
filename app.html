<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Pixel Crochê</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <a href="index.html" class="botao">⬅ Voltar</a>

    <h1>🧶 Pixel Crochê</h1>

    <p>
      Ferramenta para acompanhar seu projeto de tapeçaria
    </p>

    <label>Qualidade:</label>
    <input type="range" id="qualidade" min="20" max="100" value="50">

    <input type="file" id="upload">

    <p id="info">Linha: - | Coluna: -</p>

    <button onclick="limparProgresso()">Limpar Progresso</button>
    <button onclick="apagarImagem()">Apagar Imagem</button>

    <div>
      <button onclick="zoomIn()">➕ Zoom</button>
      <button onclick="zoomOut()">➖ Zoom</button>
    </div>

    <div id="grid"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
