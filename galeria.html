<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Galeria</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <a href="index.html" class="botao">⬅ Voltar</a>

  <h1>Galeria de Ideias</h1>

  <p>Escolha uma imagem para iniciar seu projeto:</p>

  <div class="galeria">

    <!-- ITEM -->
    <div class="card">
      <img src="img/mariposa.jpg" alt="Mariposa">
      <button onclick="selecionarImagem('img/mariposa.jpg')">
        Iniciar Projeto
      </button>
    </div>

    <div class="card">
      <img src="img/logo_batman.jpg" alt="Batman">
      <button onclick="selecionarImagem('img/logo_batman.jpg')">
        Iniciar Projeto
      </button>
    </div>

    <div class="card">
      <img src="img/tartaruga.jpg" alt="Tartaruga">
      <button onclick="selecionarImagem('img/tartaruga.jpg')">
        Iniciar Projeto
      </button>
    </div>

    <div class="card">
      <img src="img/tubaraoBaleia.jpg" alt="Tubarão Baleia">
      <button onclick="selecionarImagem('img/tubaraoBaleia.jpg')">
        Iniciar Projeto
      </button>
    </div>

    <div class="card">
      <img src="img/CaudaBaleia.jpg" alt="Cauda de Baleia">
      <button onclick="selecionarImagem('img/CaudaBaleia.jpg')">
        Iniciar Projeto
      </button>
    </div>

  </div>

</div>

<script>
 function selecionarImagem(caminho) {

  // transforma em caminho absoluto
  const urlCompleta = new URL(caminho, window.location.href).href;

  console.log("Salvando:", urlCompleta);

  localStorage.setItem("imagemModelo", urlCompleta);

  // pequeno atraso garante salvamento
  setTimeout(() => {
    window.location.href = "app.html";
  }, 100);
}
</script>

</body>
</html>
